# A local, free LLM for Theia NG's natural-language assistant.
#
#   docker compose up -d          # start Ollama and pull the model
#   docker compose logs -f pull   # watch the (one-off) model download
#
# Theia never runs a model in-process — weights are GB-scale and gunicorn forks
# workers. The model is always a separate service behind HTTP, which is also what
# makes the provider swappable: point THEIA_NG["LLM"]["BASE_URL"] elsewhere and
# nothing in Theia changes.

name: theia-ng-llm

services:
  ollama:
    image: ollama/ollama:latest
    container_name: theia-ng-ollama
    restart: unless-stopped
    ports:
      # Published so a Django container on another compose project can reach it
      # at http://host.docker.internal:11434 (Docker Desktop) — see README.
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Defaults to your existing ~/.ollama so models you already pulled are
      # reused instead of re-downloaded. Switch to the named volume below if you
      # would rather keep this stack self-contained.
      - "${OLLAMA_DATA:-${HOME}/.ollama}:/root/.ollama"
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      # Keep the model resident so the first request after an idle spell is not
      # a cold load. "-1" keeps it forever; "10m" is a reasonable middle ground.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-10m}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [llm]

  # One-off: pulls the model, then exits. Re-running `up` is cheap (no-op if the
  # model is already present).
  pull:
    image: ollama/ollama:latest
    container_name: theia-ng-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - "${OLLAMA_DATA:-${HOME}/.ollama}:/root/.ollama"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "${THEIA_LLM_MODEL:-qwen2.5:7b}"']
    restart: "no"
    networks: [llm]

networks:
  llm:
    # Named so another compose project can join it explicitly:
    #   networks: {theia-ng-llm: {external: true}}
    # See "Reaching it from your Django container" in the README.
    name: theia-ng-llm

# Unused by default (the bind mount above wins). Switch the `volumes:` entries to
# `ollama-models:/root/.ollama` for a self-contained stack.
volumes:
  ollama-models:
