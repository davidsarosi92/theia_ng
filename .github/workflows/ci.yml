name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: ["4.2", "5.2"]
    steps:
      - uses: actions/checkout@v4
      # `pip install -e .` runs hatch_build.py, which does `npm ci && ng build`.
      # The runner's preinstalled Node/npm is too old for the npm 11 lockfile
      # (fails with "Cannot read properties of null (reading 'edgesOut')") and
      # for Angular 22 — pin the same Node as release.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "Django~=${{ matrix.django-version }}.0" pytest pytest-django djangorestframework
          pip install -e .
      - name: Test
        run: pytest -v
